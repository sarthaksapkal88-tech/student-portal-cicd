apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-portal
  template:
    metadata:
      labels:
        app: student-portal
    spec:
      containers:
        - name: student-portal
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: student-portal-svc
spec:
  type: NodePort
  selector:
    app: student-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30090
